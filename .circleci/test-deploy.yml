version: 2.1

orbs:
  isort: orbss/isort@dev:<<pipeline.git.revision>>
  orb-tools: circleci/orb-tools@11.1

filters: &filters
  tags:
    only: /.*/

commands:
  verify-fixtures:
    description: >
      Fail early when the committed fixtures are missing.
    steps:
      - run:
          name: Verify test fixtures
          command: |
            set -euo pipefail

            test -s tests/clean/sorted.py
            test -s tests/clean/single_line.py
            test -s tests/clean/long_import.py
            test -s tests/unsorted/order.py
            test -s tests/unsorted/black_style.py

            echo 'Fixtures found:'
            find tests -type f -name '*.py' -print

  write-script-defaults:
    description: >
      Write PARAM_* defaults for tests that invoke execute.sh directly.
    steps:
      - run:
          name: Write execute.sh parameter defaults
          command: |
            set -euo pipefail

            printf '%s\n' \
              "export PARAM_ATOMIC='false'" \
              "export PARAM_CHECK_ONLY='true'" \
              "export PARAM_DIFF='false'" \
              "export PARAM_EXTRA_ARGS=''" \
              "export PARAM_OUTPUT_FILE=''" \
              "export PARAM_PROFILE=''" \
              "export PARAM_SETTINGS_PATH=''" \
              "export PARAM_SKIP_GITIGNORE='false'" \
              "export PARAM_TARGETS='.'" \
              "export PARAM_TEE='true'" \
              > /tmp/execute-defaults.sh

            cat /tmp/execute-defaults.sh

jobs:
  command-tests:
    executor: isort/default
    steps:
      - checkout
      - verify-fixtures

      - isort/install:
          version: "8.0.1"

      - isort/execute:
          atomic: true
          diff: true
          targets: tests/clean

  parameter-tests:
    executor: isort/default
    steps:
      - checkout
      - verify-fixtures
      - write-script-defaults

      - isort/install:
          version: "8.0.1"

      # black_style.py passes only when the black profile reaches isort.
      - isort/execute:
          profile: black
          targets: tests/unsorted/black_style.py

      - run:
          name: Verify profile changes the outcome
          command: |
            set -euo pipefail
            source /tmp/execute-defaults.sh

            set +e
            PARAM_TARGETS='tests/unsorted/black_style.py' \
              bash src/scripts/execute.sh
            status=$?
            set -e

            if [ "${status}" -eq 0 ]; then
              echo 'black_style.py passed without the black profile'
              exit 1
            fi

      # Options no longer exposed as Orb parameters are passed through
      # extra-args. Explicit files need --filter-files for --skip to apply.
      - isort/execute:
          extra-args: >-
            --filter-files
            --skip order.py
            --skip black_style.py
          targets: tests/unsorted/order.py tests/unsorted/black_style.py

      - run:
          name: Verify settings-path
          command: |
            set -euo pipefail

            printf '%s\n' \
              '[isort]' \
              'profile = black' \
              > /tmp/isort.cfg

            cat /tmp/isort.cfg

      - isort/execute:
          settings-path: /tmp/isort.cfg
          targets: tests/unsorted/black_style.py

      - run:
          name: Prepare gitignored fixture
          command: |
            set -euo pipefail

            cp tests/unsorted/order.py tests/ignored.py
            printf '%s\n' 'tests/ignored.py' >> .gitignore

      - isort/execute:
          extra-args: --filter-files
          skip-gitignore: true
          targets: tests/ignored.py

      - run:
          name: Verify report captures both output streams
          command: |
            set -euo pipefail
            source /tmp/execute-defaults.sh

            set +e
            PARAM_DIFF='true' \
            PARAM_OUTPUT_FILE='reports/order.txt' \
            PARAM_TARGETS='tests/unsorted/order.py' \
              bash src/scripts/execute.sh
            status=$?
            set -e

            if [ "${status}" -eq 0 ]; then
              echo 'An unsorted fixture did not fail the step'
              exit 1
            fi

            grep -q 'Imports are incorrectly sorted' reports/order.txt
            grep -q '^+import os' reports/order.txt

      - run:
          name: Verify report is truncated between runs
          command: |
            set -euo pipefail
            source /tmp/execute-defaults.sh

            set +e
            PARAM_DIFF='true' \
            PARAM_OUTPUT_FILE='reports/order.txt' \
            PARAM_TARGETS='tests/unsorted/order.py' \
              bash src/scripts/execute.sh
            set -e

            occurrences="$(grep -c 'Imports are incorrectly sorted' reports/order.txt)"
            test "${occurrences}" -eq 1

      - run:
          name: Verify tee controls log output
          command: |
            set -euo pipefail
            source /tmp/execute-defaults.sh

            set +e
            output="$(
              PARAM_DIFF='true' \
              PARAM_OUTPUT_FILE='reports/no-tee.txt' \
              PARAM_TARGETS='tests/unsorted/order.py' \
              PARAM_TEE='false' \
                bash src/scripts/execute.sh 2>&1
            )"
            set -e

            if printf '%s\n' "${output}" | grep -q '^+import os'; then
              echo 'The diff reached the log even though tee was disabled'
              exit 1
            fi

            grep -q '^+import os' reports/no-tee.txt

      - run:
          name: Verify missing target fails the step
          command: |
            set -euo pipefail
            source /tmp/execute-defaults.sh

            set +e
            PARAM_TARGETS='tests/clean tests/does-not-exist.py' \
              bash src/scripts/execute.sh
            status=$?
            set -e

            if [ "${status}" -eq 0 ]; then
              echo 'A missing target did not fail the step'
              exit 1
            fi

      - run:
          name: Verify empty targets fail the step
          command: |
            set -euo pipefail
            source /tmp/execute-defaults.sh

            set +e
            PARAM_TARGETS='' bash src/scripts/execute.sh
            status=$?
            set -e

            if [ "${status}" -eq 0 ]; then
              echo 'Empty targets did not fail the step'
              exit 1
            fi

      - run:
          name: Verify no-op arguments are rejected
          command: |
            set -euo pipefail
            source /tmp/execute-defaults.sh

            for argument in --show-config --show-files --interactive; do
              set +e
              PARAM_EXTRA_ARGS="${argument}" \
              PARAM_TARGETS='tests/unsorted' \
                bash src/scripts/execute.sh
              status=$?
              set -e

              if [ "${status}" -eq 0 ]; then
                echo "${argument} was accepted"
                exit 1
              fi
            done

      - run:
          name: Verify extra-args does not expand globs
          command: |
            set -euo pipefail
            source /tmp/execute-defaults.sh

            output="$(
              PARAM_EXTRA_ARGS='--extend-skip-glob tests/*.pyi' \
              PARAM_TARGETS='tests/clean' \
                bash src/scripts/execute.sh 2>&1
            )"

            command_line="$(
              printf '%s\n' "${output}" |
                grep '^Command:' |
                head -n 1
            )"

            if ! printf '%s\n' "${command_line}" |
              grep -Fq -- 'tests/\*.pyi'; then
              echo 'extra-args glob was expanded unexpectedly'
              exit 1
            fi

      - store_artifacts:
          path: reports

  write-mode-test:
    executor: isort/default
    steps:
      - checkout
      - verify-fixtures

      - isort/install:
          version: "8.0.1"

      - isort/execute:
          check-only: false
          targets: tests/unsorted

      - isort/execute:
          targets: tests/unsorted

      - run:
          name: Verify checkout was rewritten
          command: |
            set -euo pipefail

            if git diff --quiet -- tests/unsorted; then
              echo 'Write mode left the fixtures untouched'
              exit 1
            fi

            git --no-pager diff -- tests/unsorted
            git checkout -- tests/unsorted

  install-tests:
    docker:
      - image: cimg/python:3.13
    steps:
      - checkout
      - verify-fixtures

      - isort/install:
          extras: colors
          packages: packaging
          version: "8.0.1"

      - run:
          name: Verify additional package
          command: python -c 'import packaging'

      - isort/execute:
          extra-args: --color
          diff: true
          targets: tests/clean

  resource-class-test:
    executor:
      name: isort/default
      resource_class: medium
    steps:
      - checkout
      - verify-fixtures

      - isort/install:
          version: "8.0.1"

      - isort/execute:
          extra-args: --jobs 2
          targets: tests/clean

workflows:
  test-deploy:
    jobs:
      - command-tests:
          filters: *filters

      - parameter-tests:
          filters: *filters

      - write-mode-test:
          filters: *filters

      - install-tests:
          filters: *filters

      - resource-class-test:
          filters: *filters

      - orb-tools/pack:
          filters: *filters

      - orb-tools/publish:
          orb-name: orbss/isort
          vcs-type: << pipeline.project.type >>
          pub-type: production
          requires:
            - orb-tools/pack
            - command-tests
            - install-tests
            - parameter-tests
            - resource-class-test
            - write-mode-test
          context: CIRCLECI_ORBS
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+$/
