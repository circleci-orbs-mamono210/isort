---
description: >
  Execute isort
parameters:
  atomic:
    default: false
    description: >
      Refuse to save output that no longer parses as Python
      (isort '--atomic').
    type: boolean
  check-only:
    default: true
    description: >
      Report files whose imports would change instead of rewriting them
      (isort '--check-only'). This defaults to true because a CI job should
      not quietly rewrite the checkout.
    type: boolean
  diff:
    default: false
    description: >
      Print a unified diff of the changes isort would make (isort '--diff').
    type: boolean
  extra-args:
    default: ''
    description: >
      Whitespace separated list of additional isort arguments. Shell quoting
      and pathname expansion are not evaluated. '--show-config',
      '--show-files' and '--interactive' are rejected because they make isort
      return before it checks anything.
    type: string
  output-file:
    default: ''
    description: >
      Path to write the report to so it can be stored as an artifact. Both
      standard output and standard error are captured.
    type: string
  profile:
    default: ''
    description: >
      Base configuration profile (isort '--profile'), for example 'black',
      'django', 'google' or 'pycharm'.
    type: string
  settings-path:
    default: ''
    description: >
      Path of the config file, or of the directory config discovery starts
      from (isort '--settings-path').
    type: string
  skip-gitignore:
    default: false
    description: >
      Skip files listed in '.gitignore' (isort '--skip-gitignore'). This
      requires git to be available in the executor.
    type: boolean
  targets:
    default: '.'
    description: >
      Whitespace separated list of source files or directories to sort or
      check. Shell pathname expansion is not performed. Every value has to be
      a real path and paths containing whitespace are not supported.
    type: string
  tee:
    default: true
    description: >
      With 'output-file', also print the report to the CircleCI log.
    type: boolean
steps:
  - run:
      name: Show isort version
      command: <<include(scripts/show-version.sh)>>
  - run:
      name: Execute isort
      environment:
        PARAM_ATOMIC: '<<parameters.atomic>>'
        PARAM_CHECK_ONLY: '<<parameters.check-only>>'
        PARAM_DIFF: '<<parameters.diff>>'
        PARAM_EXTRA_ARGS: '<<parameters.extra-args>>'
        PARAM_OUTPUT_FILE: '<<parameters.output-file>>'
        PARAM_PROFILE: '<<parameters.profile>>'
        PARAM_SETTINGS_PATH: '<<parameters.settings-path>>'
        PARAM_SKIP_GITIGNORE: '<<parameters.skip-gitignore>>'
        PARAM_TARGETS: '<<parameters.targets>>'
        PARAM_TEE: '<<parameters.tee>>'
      command: <<include(scripts/execute.sh)>>
