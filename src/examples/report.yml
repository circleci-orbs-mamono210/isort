---
description: >
  Keep the report as a build artifact. isort writes the diff to standard
  output and error messages to standard error, so the command captures both
  into "output-file". CircleCI uploads artifacts even after the isort step
  fails.
usage:
  version: 2.1
  orbs:
    isort: orbss/isort@x.y.z
  jobs:
    execute-isort:
      executor: isort/default
      steps:
        - checkout
        - isort/install:
            version: 8.0.1
        - isort/execute:
            diff: true
            output-file: reports/isort.txt
            targets: src tests
        - store_artifacts:
            path: reports
  workflows:
    use-my-orb:
      jobs:
        - execute-isort
