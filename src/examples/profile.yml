---
description: >
  Check imports against the black profile. Less common isort options can be
  passed through "extra-args" instead of being exposed as Orb parameters.
usage:
  version: 2.1
  orbs:
    isort: orbss/isort@x.y.z
  jobs:
    execute-isort:
      executor: isort/default
      steps:
        - checkout
        - isort/install:
            version: 8.0.1
        - isort/execute:
            diff: true
            extra-args: >-
              --extend-skip migrations
              --extend-skip vendor
              --project myproject
              --line-length 100
            profile: black
            targets: src
  workflows:
    use-my-orb:
      jobs:
        - execute-isort
