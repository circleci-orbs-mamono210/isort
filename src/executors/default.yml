---
description: >
  CircleCI Python executor for running isort. This executor does not
  include isort, so run isort/install before isort/execute.
docker:
  - image: "<<parameters.image>>"
parameters:
  image:
    default: cimg/python:3.14
    type: string
  resource_class:
    default: small
    enum: ["small", "medium", "medium+", "large"]
    type: enum
resource_class: "<<parameters.resource_class>>"
